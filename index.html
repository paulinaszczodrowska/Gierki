
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egzaminacyjny Detektyw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #09090b;
            color: #e5e5e5;
            font-family: 'Courier Prime', monospace;
            overflow-x: hidden;
        }
        .font-typewriter {
            font-family: 'Special Elite', cursive;
        }
        .detective-board {
            background-image: url('https://www.transparenttextures.com/patterns/cork-board.png');
            background-color: #3f2e22;
        }
        .paper-effect {
            background-color: #f4e4bc;
            color: #1a1a1a;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <script src="script.js" defer></script>
</body>
</html>
